<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>边境平定 · 战棋原型</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #171a23;
        --panel-2: #1e2230;
        --line: #2b3142;
        --text: #d7dcea;
        --dim: #8a93a8;
        --accent: #4d8ef7;
        --danger: #e2574c;
        --warn: #ffc857;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        font-size: 13px;
      }
      /* display:flex 会盖掉 hidden 属性自带的 display:none，所以显式兜一下 */
      [hidden] { display: none !important; }

      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        padding: 9px 18px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #08111f;
        font-weight: 600;
      }
      button.ghost {
        background: transparent;
        color: var(--text);
        border-color: var(--line);
        font-weight: 400;
      }
      button.ghost:hover { border-color: var(--dim); }

      /* ---------------------------------------------------------- 关卡选择 */

      #menu {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 44px 20px;
      }
      #menu header { text-align: center; }
      #menu h1 {
        margin: 0 0 6px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      #menu-subtitle { margin: 0; }
      #menu footer {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 12px;
      }

      #level-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(580px, 92vw);
      }
      .level {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        padding: 12px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        font-weight: 400;
        transition: border-color 0.12s, background 0.12s, transform 0.12s;
      }
      .level:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--panel-2);
        transform: translateX(2px);
      }
      .level:disabled { opacity: 0.42; cursor: not-allowed; }
      .level .no {
        min-width: 36px;
        font: 600 20px/1 ui-monospace, Consolas, monospace;
        color: var(--dim);
      }
      .level.cleared .no { color: var(--accent); }
      .level .body { flex: 1; display: flex; flex-direction: column; gap: 3px; }
      .level .name { font-size: 15px; font-weight: 600; }
      .level .brief { font-size: 12px; color: var(--dim); line-height: 1.5; }
      .level .status { font-size: 12px; color: var(--dim); white-space: nowrap; }
      .level.cleared .status { color: #6ee79a; }
      .level.resume { border-color: var(--accent); }
      .level.resume .no { color: var(--accent); }

      /* -------------------------------------------------------------- 战斗 */

      #battle {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 14px;
        min-height: 100vh;
      }
      #stage {
        /* 演出横幅要绝对定位盖在画布上 */
        position: relative;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        line-height: 0;
        background: #14161c;
      }

      /* 阶段 / 胜负横幅。刻意用 DOM 而不是 canvas 文字：
         canvas 里的字会被镜头缩放和位移带偏，DOM 完全不受影响；
         而且配色、字体、动画就是普通 CSS，迭代成本低一个数量级。 */
      #fx-banner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        pointer-events: none;
        opacity: 0;
        line-height: 1.3;
      }
      #fx-banner.show { animation: banner-flash 1500ms ease-out forwards; }
      #fx-banner .t {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffffff;
        text-shadow: 0 2px 0 #000, 0 0 24px rgba(0, 0, 0, 0.95);
      }
      #fx-banner .s {
        font-size: 13px;
        letter-spacing: 0.3em;
        color: #cfd7ea;
        text-shadow: 0 1px 0 #000;
      }
      #fx-banner.won .t { color: #6ee79a; }
      #fx-banner.lost .t { color: #ff8b80; }
      @keyframes banner-flash {
        0%   { opacity: 0; transform: scale(1.14); }
        14%  { opacity: 1; transform: scale(1); }
        72%  { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.03); }
      }

      /* 结算面板 */
      #result {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 14, 0.78);
      }
      #result .panel {
        min-width: 320px;
        padding: 28px 36px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      #result h2 {
        margin: 0 0 10px;
        font-size: 26px;
        letter-spacing: 0.08em;
      }
      #result.won h2 { color: #6ee79a; }
      #result.lost h2 { color: #ff8b80; }
      #result .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 22px;
      }

      /* ---------------------------------------------------------------- HUD */

      #hud {
        width: 288px;
        flex: 0 0 288px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--dim);
        text-transform: uppercase;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 2px 0;
      }
      .row .k { color: var(--dim); }
      .row .v { font-variant-numeric: tabular-nums; }
      .big { font-size: 20px; font-weight: 600; }
      .player { color: var(--accent); }
      .enemy { color: var(--danger); }
      .hpbar {
        height: 7px;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
        margin: 6px 0 4px;
      }
      .hpfill {
        height: 100%;
        background: #46c46a;
        transition: width 0.12s linear;
      }
      #forecast .hit { color: var(--warn); }
      #forecast .good { color: #6ee79a; }
      #forecast .kill { color: #6ee79a; font-weight: 600; }
      #forecast .risk { color: #ff8b80; }

      /* 经验条刻意和血条用完全不同的颜色：
         两条进度条挨在一起时，颜色不分家就会看错 */
      .expbar {
        height: 5px; border-radius: 3px; background: #10131b;
        margin: 1px 0 8px; overflow: hidden;
      }
      .expfill { height: 100%; background: #4fb4e8; }
      .exprow { margin-top: 6px; }
      .exprow .k { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

      /* 携带的武器列表：当前装备的那把用琥珀色标出来 */
      #unit-info .weapon { align-items: flex-start; }
      #unit-info .weapon.on .k,
      #unit-info .weapon.on .v { color: #ffd166; }
      #unit-info .sub { display: block; color: var(--dim); font-size: 11px; }
      #unit-info .weapon.on .sub { color: #d8b45f; }
      .muted { color: var(--dim); }
      .warn { color: var(--warn); }
      #log {
        height: 148px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.65;
        color: #a9b2c6;
        font-family: ui-monospace, Consolas, monospace;
      }
      #log div:last-child { color: var(--text); }
      kbd {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
      }
      .keys { line-height: 2; color: var(--dim); }
      #banner {
        display: none;
        text-align: center;
        padding: 10px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
      }
      #banner.won { display: block; background: #12351f; color: #6ee79a; border: 1px solid #2c6b41; }
      #banner.lost { display: block; background: #3a1414; color: #ff8b80; border: 1px solid #7a2b26; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- ------------------------------------------------------ 关卡选择 -->
      <section id="menu">
        <header>
          <h1 id="menu-title"></h1>
          <p id="menu-subtitle" class="muted"></p>
        </header>

        <div id="level-list"></div>

        <footer>
          <span id="menu-save-note" class="muted"></span>
          <button id="menu-reset" type="button" class="ghost">清除进度</button>
        </footer>
      </section>

      <!-- ---------------------------------------------------------- 战斗 -->
      <main id="battle" hidden>
        <div id="stage">
          <div id="fx-banner"></div>
        </div>

        <aside id="hud">
          <button id="hud-menu" type="button" class="ghost">← 返回关卡列表</button>

          <div id="banner"></div>

          <div class="card">
            <h2>战况</h2>
            <div class="row">
              <span class="k">回合</span>
              <span class="v big" id="turn">1</span>
            </div>
            <div class="row">
              <span class="k">阶段</span>
              <span class="v" id="phase">我方行动</span>
            </div>
            <div class="row">
              <span class="k">目标</span>
              <span class="v" id="objective">全灭敌人</span>
            </div>
            <div class="row">
              <span class="k">我方存活</span>
              <span class="v player" id="player-count">0</span>
            </div>
            <div class="row">
              <span class="k">敌方存活</span>
              <span class="v enemy" id="enemy-count">0</span>
            </div>
          </div>

          <div class="card">
            <h2>选中单位</h2>
            <div id="unit-info" class="muted">点击我方单位以选择</div>
          </div>

          <div class="card">
            <h2>战斗预测</h2>
            <div id="forecast" class="muted">把光标移到攻击范围内的敌人上</div>
          </div>

          <div class="card">
            <h2>光标处地形</h2>
            <div id="terrain" class="muted">—</div>
          </div>

          <div class="card">
            <h2>操作</h2>
            <div class="keys">
              <kbd>左键</kbd> 选择 / 移动 / 攻击<br />
              <kbd>Space</kbd> 待机（未选中时结束回合）<br />
              <kbd>E</kbd> 结束我方回合<br />
              <kbd>T</kbd> <span id="threat-state">威胁范围：关</span><br />
              <kbd>M</kbd> <span id="sfx-state">音效：开</span><br />
              <kbd>Esc</kbd> 取消选择<br />
              <kbd>R</kbd> 重开本关
            </div>
          </div>

          <div class="card">
            <h2>日志</h2>
            <div id="log"></div>
          </div>
        </aside>

        <div id="result" hidden>
          <div class="panel">
            <h2 id="result-title"></h2>
            <p id="result-detail" class="muted"></p>
            <div class="actions">
              <button id="result-menu" type="button">返回关卡列表</button>
              <button id="result-retry" type="button" class="ghost">重打本关</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
